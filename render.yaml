# RecruitBoard: one Free web service; PostgreSQL is hosted separately on Neon.
# Enter prompted values only in Render. Never commit credentials or a database URL.
# PORT is supplied by Render. No SESSION_SECRET is used: sessions are random,
# database-backed tokens, not signed client-side session payloads.
services:
  - type: web
    name: recruitboard-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    # Current Render syntax for automatic deploys ON (legacy: autoDeploy: true).
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: LOGIN_LIMIT
        value: "10"
      - key: WRITE_LIMIT
        value: "120"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false